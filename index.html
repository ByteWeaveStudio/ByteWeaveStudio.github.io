    <!-- The Organization node lives here so it is on every page. Everything
         src/seo.ts emits — every author, publisher and provider — points at
         this @id, so it has to be declared, not just described. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://byteweave.studio/#organization",
        "name": "ByteWeave Studio",
        "alternateName": "ByteWeave",
        "url": "https://byteweave.studio/",
        "logo": {
          "@type": "ImageObject",
          "@id": "https://byteweave.studio/#logo",
          "url": "https://byteweave.studio/icon-512.png",
          "contentUrl": "https://byteweave.studio/icon-512.png",
          "width": 512,
          "height": 512,
          "caption": "ByteWeave Studio"
        },
        "image": { "@id": "https://byteweave.studio/#logo" },
        "email": "hello@byteweave.studio",
        "description": "AI engineering and software development studio building production systems with computer vision, document intelligence and LLMs.",
        "slogan": "Software that Thinks.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bengaluru",
          "addressCountry": "IN"
        },
        "areaServed": "Worldwide",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "hello@byteweave.studio",
          "url": "https://byteweave.studio/contact",
          "availableLanguage": ["en"],
          "areaServed": "Worldwide"
        },
        "knowsAbout": [
          "Computer vision",
          "Document intelligence",
          "Optical character recognition",
          "Large language models",
          "Retrieval-augmented generation",
          "Model Context Protocol",
          "Video analytics",
          "Full-stack web development",
          "Mobile application development"
        ],
        "sameAs": [
          "https://www.linkedin.com/company/byteweave-studio",
          "https://www.instagram.com/byteweave.studio"
        ]
      }
    </script>
